version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PRIORLABS_API_KEY=${PRIORLABS_API_KEY:-}
      - TABPFN_TOKEN=${TABPFN_TOKEN:-}

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend